         line (and public/robots.txt) if that ever changes. --><meta name="robots" content="noindex, nofollow"><meta name="color-scheme" content="dark"><title>BlackIT Flow · one task chain per project</title><meta name="description" content="BlackIT Flow is a single vertical task chain per project: every task carries its own status, nothing is forced into order, and anyone can claim work that has no owner."><meta property="og:title" content="BlackIT Flow · one task chain per project"><meta property="og:description" content="BlackIT Flow is a single vertical task chain per project: every task carries its own status, nothing is forced into order, and anyone can claim work that has no owner."><meta property="og:type" content="website"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><script>(function(){const STORAGE_KEY = "blackit_flow_v1";

      // First run (no saved workspace) must not flash the demo shell.
      try {
        if (!localStorage.getItem(STORAGE_KEY)) document.documentElement.classList.add('first-run');
      } catch (e) {
        document.documentElement.classList.add('first-run');
      }

      // Failsafe. The client entry removes `first-run` when it boots, but if it
      // never loads — a stale dependency cache, a 404, any error — the shell
      // would stay hidden and the page would be blank with no explanation. A
      // hidden page with no message is the worst failure, so reveal it anyway
      // and say what to do.
      window.addEventListener('DOMContentLoaded', () => {
        window.setTimeout(() => {
          if (!document.documentElement.classList.contains('first-run')) return;
          document.documentElement.classList.remove('first-run');
          const host = document.getElementById('boot-error');
          if (!host) return;
          host.innerHTML =
            '<div class="setuprow">' +
            '<span><b>The app did not finish starting.</b> This is usually a stale dev-server ' +
            'cache: stop the server, delete <code>node_modules/.vite</code>, and start it again. ' +
            'The browser console names the failing file.</span>' +
            '</div>';
          host.classList.add('on');
        }, 6000);
      });
    })();</script><style>

      html.first-run .sub,
      html.first-run .wrap,
      html.first-run .fab { visibility: hidden; }
      /* Never leave the page hidden when scripting is unavailable. */
      html.no-js .top,
      html.no-js .sub,
      html.no-js .wrap,
      html.no-js .fab { visibility: visible; }
